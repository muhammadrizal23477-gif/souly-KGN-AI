<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>SoulyKGN — Teman Ngobrol AI</title>
<meta name="description" content="SoulyKGN, teman ngobrol AI buat kangen, excited, luapkan rasa, dan motivasi.">
<link rel="icon" href="logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; font-family:'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
  background:#0A0D12; color:#E7ECF2; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input,textarea{ font-family:inherit; }
::selection{ background:rgba(47,140,255,0.35); }

:root{
  --bg:#0A0D12; --panel:#10151C; --panel-alt:#141A22; --line:rgba(255,255,255,0.08);
  --text:#E7ECF2; --text-soft:#8A94A3; --brand:#2F8CFF; --danger:#FF5C7A;
}

.brand-word{ font-family:'Rajdhani', sans-serif; font-weight:700; letter-spacing:-0.01em; font-style:italic; }
.brand-souly{ background:linear-gradient(180deg,#F5F7FA,#9AA4B2); -webkit-background-clip:text; background-clip:text; color:transparent; }
.brand-kgn{ background:linear-gradient(180deg,#7FC4FF,#2E7BEA); -webkit-background-clip:text; background-clip:text; color:transparent; }

#root{ width:100%; height:100vh; height:calc(var(--app-vh, 1vh) * 100); height:100dvh; }

/* ---------- Intro video ---------- */
.souly-intro{ position:relative; width:100%; height:100%; background:#000; display:flex; align-items:center; justify-content:center; }
.souly-intro-video{ width:100%; height:100%; object-fit:cover; display:block; }
.souly-intro-skip{
  position:absolute; right:16px; bottom:calc(16px + env(safe-area-inset-bottom));
  padding:9px 16px; border-radius:999px; background:rgba(20,26,34,0.65);
  border:1px solid rgba(255,255,255,0.18); color:#E7ECF2; font-size:13px; font-weight:600;
  backdrop-filter:blur(6px); z-index:5;
}
.souly-intro-skip:active{ opacity:0.75; }

/* ---------- App shell ---------- */
.souly-app{
  position:relative; width:100%; height:100%; display:flex;
  background:
    radial-gradient(1100px 550px at 85% -10%, rgba(47,140,255,0.16), transparent 60%),
    radial-gradient(800px 500px at -10% 110%, rgba(139,127,214,0.10), transparent 60%),
    var(--bg);
}
.souly-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:20; display:none; }
.souly-backdrop.show{ display:block; }

/* ---------- Sidebar ---------- */
.souly-sidebar{
  width:280px; flex-shrink:0; height:100%; background:var(--panel);
  border-right:1px solid var(--line); display:flex; flex-direction:column;
  padding:18px 14px; gap:14px; overflow-y:auto; z-index:21;
}
.souly-sidebar-head{ display:flex; align-items:center; justify-content:space-between; }
.souly-brand{ display:flex; align-items:center; gap:11px; }
.souly-brand-logo-wrap{ position:relative; width:54px; height:54px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.souly-brand-logo{ position:relative; width:38px; height:38px; object-fit:contain; filter:drop-shadow(0 0 10px rgba(47,140,255,0.5)); }
.souly-brand-text{ display:flex; flex-direction:column; line-height:1.15; }
.souly-brand-text .brand-word{ font-size:19px; }
.souly-brand-text small{ font-size:10.5px; color:var(--text-soft); font-weight:500; margin-top:2px; }

.souly-ring{
  position:absolute; inset:0; margin:auto; border-radius:50%;
  border:2px solid transparent; border-top-color:var(--ring-color); border-right-color:var(--ring-color);
  opacity:0.85; animation:souly-spin 2.6s linear infinite;
}
.souly-ring::after{
  content:''; position:absolute; inset:-6px; border-radius:50%;
  box-shadow:0 0 18px 1px var(--ring-color); opacity:0.35;
}
@keyframes souly-spin{ to{ transform:rotate(360deg); } }

.souly-mode-toggle{ display:flex; gap:8px; background:var(--panel-alt); padding:5px; border-radius:14px; border:1px solid var(--line); }
.souly-mode-btn{
  flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
  padding:9px 8px; border-radius:10px; color:var(--text-soft); font-size:12.5px; font-weight:600;
  background:transparent; transition:all .15s ease;
}
.souly-mode-btn span{ display:flex; flex-direction:column; align-items:flex-start; line-height:1.25; }
.souly-mode-btn small{ font-size:9.5px; font-weight:500; opacity:0.75; }
.souly-mode-btn.active{ background:linear-gradient(135deg,#2F8CFF,#1E63C4); color:#fff; box-shadow:0 4px 14px rgba(47,140,255,0.35); }

.souly-section-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-soft); padding:2px 2px 0; }
.souly-history-label{ margin-top:4px; padding-top:10px; border-top:1px solid var(--line); display:flex; }

.souly-theme-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.souly-theme-card{
  display:flex; align-items:center; gap:7px; padding:11px 10px; border-radius:12px;
  background:var(--panel-alt); border:1px solid var(--line); color:var(--text);
  font-size:12.5px; font-weight:600; text-align:left; transition:all .15s ease;
}
.souly-theme-card .ic{ color:var(--accent); flex-shrink:0; font-size:15px; }
.souly-theme-card:hover{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset, 0 6px 16px -6px var(--accent); transform:translateY(-1px); }
.souly-theme-card.wide{ grid-column:1 / -1; justify-content:center; background:linear-gradient(135deg, rgba(47,140,255,0.14), rgba(47,140,255,0.03)); }

.souly-history{ display:flex; flex-direction:column; gap:4px; flex:1; min-height:0; }
.souly-history-empty{ font-size:12px; color:var(--text-soft); padding:10px 4px; line-height:1.5; }
.souly-history-item{
  display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:10px; width:100%;
  background:transparent; color:var(--text-soft); font-size:12.5px; font-weight:500; text-align:left; position:relative;
}
.souly-history-item:hover{ background:var(--panel-alt); color:var(--text); }
.souly-history-item.active{ background:var(--panel-alt); color:var(--text); box-shadow:inset 3px 0 0 var(--accent); }
.souly-history-icon{ color:var(--accent); flex-shrink:0; font-size:13px; }
.souly-history-title{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.souly-history-del{ opacity:0; color:var(--text-soft); padding:4px; border-radius:6px; font-size:12px; }
.souly-history-item:hover .souly-history-del{ opacity:1; }
.souly-history-del:hover{ color:#FF5C7A; background:rgba(255,92,122,0.12); }

.souly-sidebar-footer{ display:flex; flex-direction:column; gap:7px; padding-top:10px; border-top:1px solid var(--line); }
.souly-footer-btn{
  display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:10px;
  background:var(--panel-alt); border:1px solid var(--line); color:var(--text-soft); font-size:12px; font-weight:600;
}
.souly-footer-btn:hover{ color:var(--text); border-color:var(--brand); }
.souly-footer-user{ font-size:11.5px; color:var(--text-soft); padding:0 2px; display:flex; align-items:center; gap:6px; }
.souly-footer-user b{ color:var(--text); font-weight:700; }

/* ---------- Main ---------- */
.souly-main{ flex:1; min-width:0; display:flex; flex-direction:column; height:100%; }
.souly-topbar{
  display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line);
  background:rgba(16,21,28,0.7); backdrop-filter:blur(10px); flex-shrink:0;
}
.souly-topbar-theme{ display:flex; align-items:center; gap:9px; flex:1; min-width:0; }
.souly-topbar-theme .ic{ flex-shrink:0; font-size:18px; }
.souly-topbar-theme div{ display:flex; flex-direction:column; line-height:1.2; min-width:0; }
.souly-topbar-theme b{ font-size:13.5px; color:var(--accent); }
.souly-topbar-theme small{ font-size:11px; color:var(--text-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.souly-topbar-mode{
  display:flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--text-soft);
  padding:6px 10px; border-radius:999px; border:1px solid var(--line); flex-shrink:0;
}
.souly-iconbtn{ background:var(--panel-alt); border:1px solid var(--line); color:var(--text); width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.souly-only-mobile{ display:none; }

.souly-thread{ flex:1; overflow-y:auto; padding:22px 20px 10px; display:flex; flex-direction:column; gap:16px; }

.souly-empty-state{ margin:auto; text-align:center; max-width:440px; display:flex; flex-direction:column; align-items:center; padding:30px 10px; }
.souly-empty-logo-wrap{ position:relative; width:84px; height:84px; margin:0 auto; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.souly-empty-logo{ position:relative; z-index:1; width:56px; height:56px; object-fit:contain; filter:drop-shadow(0 0 16px rgba(47,140,255,0.5)); }
.souly-empty-icon{ position:relative; z-index:1; font-size:40px; }
.souly-empty-state h2{ font-family:'Rajdhani',sans-serif; font-style:italic; font-weight:700; font-size:26px; margin:14px 0 6px; }
.souly-empty-state p{ color:var(--text-soft); font-size:13.5px; line-height:1.6; margin:0 0 18px; }
.souly-starter-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.souly-starter-chip{
  border:1px solid var(--line); background:var(--panel-alt); color:var(--text);
  padding:9px 14px; border-radius:999px; font-size:12.5px; font-weight:500;
}
.souly-starter-chip:hover{ border-color:var(--accent); color:var(--accent); }

.souly-msg{ display:flex; gap:10px; max-width:78%; animation:souly-fade .25s ease; }
.souly-msg.ai{ align-self:flex-start; }
.souly-msg.user{ align-self:flex-end; flex-direction:row-reverse; }
@keyframes souly-fade{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

.souly-avatar{ width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  background:var(--panel-alt); border:1px solid var(--accent); box-shadow:0 0 10px -2px var(--accent); margin-top:2px; overflow:hidden; }
.souly-avatar img{ width:17px; height:17px; object-fit:contain; }

.souly-bubble{ padding:11px 15px; border-radius:16px; font-size:13.5px; line-height:1.6; }
.souly-bubble p{ margin:0; white-space:pre-wrap; overflow-wrap:break-word; }
.souly-bubble.ai{ background:var(--panel-alt); border:1px solid var(--line); border-top-left-radius:4px; box-shadow:inset 2px 0 0 var(--accent); }
.souly-bubble.user{ background:linear-gradient(135deg,#2F8CFF,#1E63C4); color:#fff; border-top-right-radius:4px; }

.souly-typing{ display:flex; align-items:center; gap:5px; padding:15px 16px; }
.souly-dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); animation:souly-bounce 1.1s infinite ease-in-out; }
.souly-dot:nth-child(2){ animation-delay:.15s; }
.souly-dot:nth-child(3){ animation-delay:.3s; }
@keyframes souly-bounce{ 0%,60%,100%{ transform:translateY(0); opacity:.5; } 30%{ transform:translateY(-4px); opacity:1; } }

.souly-error{ align-self:center; font-size:12px; color:#FF9DAE; background:rgba(255,92,122,0.1); border:1px solid rgba(255,92,122,0.3); padding:8px 14px; border-radius:999px; }

.souly-composer{ display:flex; gap:10px; align-items:flex-end; padding:14px 20px calc(18px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); flex-shrink:0; }
.souly-input{
  flex:1; resize:none; max-height:140px; background:var(--panel-alt); border:1px solid var(--line); color:var(--text);
  padding:12px 16px; border-radius:16px; font-size:13.5px; font-family:inherit; line-height:1.5; outline:none;
}
.souly-input:focus{ border-color:var(--brand); }
.souly-input::placeholder{ color:var(--text-soft); }
.souly-sendbtn{
  width:44px; height:44px; border-radius:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg, var(--accent), #14181f); color:#fff; box-shadow:0 6px 16px -6px var(--accent);
}
.souly-sendbtn:disabled{ opacity:0.4; box-shadow:none; }
.souly-spin{ animation:souly-spin 0.9s linear infinite; display:inline-block; }

.souly-thread::-webkit-scrollbar, .souly-sidebar::-webkit-scrollbar{ width:7px; }
.souly-thread::-webkit-scrollbar-thumb, .souly-sidebar::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.12); border-radius:10px; }

/* ---------- Auth screen ---------- */
.souly-auth{
  width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:20px;
  background:
    radial-gradient(1100px 550px at 85% -10%, rgba(47,140,255,0.18), transparent 60%),
    radial-gradient(800px 500px at -10% 110%, rgba(139,127,214,0.12), transparent 60%),
    var(--bg);
}
.souly-auth-card{
  width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:24px;
  padding:28px 26px 24px; box-shadow:0 30px 70px rgba(0,0,0,0.45);
}
.souly-auth-head{ display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:20px; }
.souly-auth-head .souly-brand-logo-wrap{ margin-bottom:10px; }
.souly-auth-head h1{ font-family:'Rajdhani',sans-serif; font-style:italic; font-weight:700; font-size:24px; margin:2px 0 4px; }
.souly-auth-head p{ font-size:12.5px; color:var(--text-soft); margin:0; }
.souly-auth-tabs{ display:flex; gap:6px; background:var(--panel-alt); padding:5px; border-radius:12px; margin-bottom:18px; border:1px solid var(--line); }
.souly-auth-tab{ flex:1; padding:9px; border-radius:9px; font-size:12.5px; font-weight:700; color:var(--text-soft); }
.souly-auth-tab.active{ background:linear-gradient(135deg,#2F8CFF,#1E63C4); color:#fff; }
.souly-field{ margin-bottom:12px; }
.souly-field label{ display:block; font-size:11.5px; font-weight:700; color:var(--text-soft); margin-bottom:6px; letter-spacing:0.02em; }
.souly-field input{
  width:100%; background:var(--panel-alt); border:1px solid var(--line); color:var(--text);
  padding:11px 14px; border-radius:12px; font-size:13.5px; outline:none;
}
.souly-field input:focus{ border-color:var(--brand); }
.souly-auth-error{ font-size:12px; color:#FF9DAE; background:rgba(255,92,122,0.1); border:1px solid rgba(255,92,122,0.3); padding:9px 12px; border-radius:10px; margin-bottom:12px; line-height:1.5; }
.souly-auth-submit{
  width:100%; padding:12px; border-radius:12px; font-size:13.5px; font-weight:700; color:#fff; margin-top:4px;
  background:linear-gradient(135deg,#2F8CFF,#1E63C4); box-shadow:0 8px 20px -6px rgba(47,140,255,0.5);
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.souly-auth-submit:disabled{ opacity:0.55; }
.souly-auth-hint{ text-align:center; font-size:11px; color:var(--text-soft); margin-top:14px; line-height:1.6; }

/* ---------- Modal (Dev Info) ---------- */
.souly-modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:40; display:flex; align-items:center; justify-content:center; padding:20px; }
.souly-modal{
  width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line); border-radius:22px;
  padding:26px 22px 22px; box-shadow:0 30px 70px rgba(0,0,0,0.5); text-align:center; position:relative; animation:souly-fade .2s ease;
}
.souly-modal-close{ position:absolute; top:14px; right:14px; width:28px; height:28px; border-radius:9px; background:var(--panel-alt); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--text-soft); }
.souly-modal-close:hover{ color:var(--text); }
.souly-dev-avatar{
  width:70px; height:70px; border-radius:50%; margin:4px auto 14px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#2F8CFF,#1E63C4); font-family:'Rajdhani',sans-serif; font-weight:700; font-size:28px; color:#fff;
  box-shadow:0 10px 24px -6px rgba(47,140,255,0.55); position:relative;
}
.souly-dev-avatar .souly-ring{ inset:-8px; }
.souly-modal h3{ font-family:'Rajdhani',sans-serif; font-style:italic; font-weight:700; font-size:19px; margin:0 0 2px; }
.souly-modal .role{ font-size:11.5px; color:var(--brand); font-weight:700; margin-bottom:16px; }
.souly-dev-row{ display:flex; justify-content:space-between; padding:10px 12px; background:var(--panel-alt); border:1px solid var(--line); border-radius:12px; margin-bottom:8px; font-size:12.5px; }
.souly-dev-row span:first-child{ color:var(--text-soft); font-weight:600; }
.souly-dev-row span:last-child{ font-weight:700; }
.souly-modal .souly-dev-note{ font-size:11.5px; color:var(--text-soft); line-height:1.6; margin-top:14px; }
.souly-dev-whatsapp{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  margin-top:14px; padding:12px 14px; border-radius:12px; font-size:13px; font-weight:700;
  color:#fff; background:linear-gradient(135deg,#25D366,#128C4A);
  box-shadow:0 8px 20px -6px rgba(37,211,102,0.5);
}
.souly-dev-whatsapp:active{ opacity:0.85; }
.souly-dev-whatsapp .ic{ font-size:15px; }

@media (max-width: 820px){
  .souly-sidebar{ position:fixed; inset:0 auto 0 0; transform:translateX(-100%); transition:transform .22s ease; width:82vw; max-width:300px; }
  .souly-sidebar.open{ transform:translateX(0); }
  .souly-backdrop{ display:none; }
  .souly-backdrop.show{ display:block; }
  .souly-only-mobile{ display:flex; }
  .souly-msg{ max-width:88%; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* =========================================================
   SoulyKGN — front-end (vanilla JS, tanpa build step)
   ========================================================= */

const LOGO_SRC = 'logo.png';

const THEMES = {
  kangen: {
    key:'kangen', label:'Kangen', tagline:'Ruang buat rindu yang belum sempat diomongin',

  },
  motivasi: {

    icon:'🔥', color:'#34D399',
    starters:['Aku lagi ngerasa down soal target aku','Rasanya pengen nyerah, butuh semangat','Aku butuh dorongan buat mulai lagi'],
  },
  semua: {

    starters:['Halo SoulyKGN!','Aku pengen cerita random hari ini','Temenin aku ngobrol dong'],
  },
};

const MODES = {

  human: { key:'human', label:'Human', icon:'😄', desc:'Santai kayak temen' },
};

const DEV_INFO = { name:'MUHAMMAD RIZAL FEBIANSYAH', age:16, whatsapp:'6285965940576' };

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* Aman dipakai di dalam atribut onclick="..." (attribute-nya pakai kutip dua) */
function attrJson(s){
  return JSON.stringify(s).replace(/"/g, '&quot;');
}

const State = {
  view:'login',
  authTab:'login',
  authError:'', authLoading:false,
  username:null, token:null,
  chats:[], currentId:null,
  mode:'ai',
  sidebarOpen:false,
  isTyping:false,
  errorMsg:'',
  devInfoOpen:false,
};

/* ---------------- Intro video (tampil sekali tiap habis login) ---------------- */
function goToAppAfterIntro(){
  State.view='app';
  render();
  loadChats();
}
function skipIntro(){
  const v = document.getElementById('introVideo');
  if(v){ v.pause(); }
  goToAppAfterIntro();
}
function renderIntro(){
  return `
  <div class="souly-intro">
    <video id="introVideo" class="souly-intro-video" src="intro.mp4" autoplay muted playsinline webkit-playsinline onended="goToAppAfterIntro()"></video>
    <button class="souly-intro-skip" onclick="skipIntro()">Lewati ›</button>
  </div>`;
}

/* ---------------- Auth persistence ---------------- */
function loadAuthFromStorage(){
  try{
    const raw = localStorage.getItem('soulykgn_auth');
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function saveAuthToStorage(username, token){
  try{ localStorage.setItem('soulykgn_auth', JSON.stringify({username, token})); }catch(e){}
}
function clearAuthStorage(){
  try{ localStorage.removeItem('soulykgn_auth'); }catch(e){}
}

/* ---------------- API helper ---------------- */
async function api(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(State.token){ headers['x-souly-user']=State.username; headers['x-souly-token']=State.token; }
  let res;
  try{
    res = await fetch(path, Object.assign({}, opts, {headers}));
  }catch(e){
    throw new Error('Tidak bisa terhubung ke server. Pastikan server sedang berjalan dan kamu membuka lewat alamat http(s):// yang benar, bukan file lokal.');
  }
  if(res.status===401 && State.view==='app'){
    doLogout(true);
    throw new Error('Sesi berakhir, silakan login lagi');
  }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'Terjadi kesalahan');
  return data;
}

/* Fetch khusus untuk halaman login/daftar (belum ada token).
   Menerjemahkan error jaringan mentah ("Failed to fetch") jadi pesan yang jelas. */
async function authFetch(path, body){
  let res;
  try{
    res = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  }catch(e){
    throw new Error('Gagal terhubung ke server (Failed to fetch). Kemungkinan: server belum jalan / masih "bangun tidur" / URL yang dibuka salah. Cek panduan di bawah tombol.');
  }
  const d = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(d.error || 'Terjadi kesalahan, coba lagi.');
  return d;
}

/* ---------------- Init ---------------- */
function init(){
  const auth = loadAuthFromStorage();
  if(auth && auth.username && auth.token){
    State.username = auth.username;
    State.token = auth.token;
    State.view = 'app';
    render();
    loadChats();
  } else {
    render();
  }
}

/* ---------------- Auth actions ---------------- */
function setAuthTab(tab){ State.authTab=tab; State.authError=''; render(); }

async function doRegister(){
  const username = (document.getElementById('authUsername')||{}).value?.trim();
  const password = (document.getElementById('authPassword')||{}).value;
  const confirm = (document.getElementById('authConfirm')||{}).value;
  if(!username || !password){ State.authError='Isi username dan password dulu ya'; render(); return; }
  if(password !== confirm){ State.authError='Konfirmasi password tidak sama'; render(); return; }
  State.authLoading=true; State.authError=''; render();
  try{
    const data = await authFetch('/api/register', {username,password});
    State.username = data.username; State.token = data.token;
    saveAuthToStorage(data.username, data.token);
    State.view='intro'; State.authLoading=false;
    render();
  }catch(err){
    State.authLoading=false; State.authError = err.message; render();
  }
}

async function doLogin(){
  const username = (document.getElementById('authUsername')||{}).value?.trim();
  const password = (document.getElementById('authPassword')||{}).value;
  if(!username || !password){ State.authError='Isi username dan password dulu ya'; render(); return; }
  State.authLoading=true; State.authError=''; render();
  try{
    const data = await authFetch('/api/login', {username,password});
    State.username = data.username; State.token = data.token;
    saveAuthToStorage(data.username, data.token);
    State.view='intro'; State.authLoading=false;
    render();
  }catch(err){
    State.authLoading=false; State.authError = err.message; render();
  }
}

function doLogout(silent){
  clearAuthStorage();
  State.username=null; State.token=null; State.chats=[]; State.currentId=null;
  State.view='login'; State.authTab='login'; State.errorMsg='';
  if(!silent) toastQuiet();
  render();
}
function toastQuiet(){ /* no-op placeholder untuk konsistensi gaya kode */ }

/* ---------------- Chat data ---------------- */
async function loadChats(){
  try{
    const data = await api('/api/chats');
    State.chats = data.chats || [];
    if(!State.currentId && State.chats.length) State.currentId = State.chats[0].id;
    render();
  }catch(err){ /* diamkan, sudah ditangani di api() kalau 401 */ }
}

function getCurrentChat(){ return State.chats.find(c=>c.id===State.currentId) || null; }

async function persistChat(chat){
  try{ await api('/api/chats', {method:'POST', body:JSON.stringify(chat)}); }
  catch(err){ /* best effort */ }
}

function startNewChat(themeKey){
  const theme = THEMES[themeKey];
  const chat = { id:uid(), theme:themeKey, mode:State.mode, title:theme.label, messages:[], createdAt:Date.now(), updatedAt:Date.now() };
  State.chats = [chat, ...State.chats];
  State.currentId = chat.id;
  State.sidebarOpen = false;
  State.errorMsg = '';
  render();
  persistChat(chat);
}

function selectChat(id){ State.currentId=id; State.sidebarOpen=false; render(); }

async function deleteChat(id, ev){
  ev.stopPropagation();
  State.chats = State.chats.filter(c=>c.id!==id);
  if(State.currentId===id) State.currentId = State.chats.length? State.chats[0].id : null;
  render();
  try{ await api('/api/chats/'+id, {method:'DELETE'}); }catch(err){}
}

function setMode(key){ State.mode = key; render(); }

async function sendText(rawText){
  const text = (rawText||'').trim();
  if(!text || State.isTyping) return;

  let chat = getCurrentChat();
  if(!chat){
    chat = { id:uid(), theme:'semua', mode:State.mode, title:THEMES.semua.label, messages:[], createdAt:Date.now(), updatedAt:Date.now() };
    State.chats = [chat, ...State.chats];
    State.currentId = chat.id;
  }

  const userMsg = { id:uid(), role:'user', text, ts:Date.now() };
  chat.messages.push(userMsg);
  chat.updatedAt = Date.now();
  if(chat.messages.length===1) chat.title = text.slice(0,28) + (text.length>28?'…':'');

  const input = document.getElementById('soulyInput');
  if(input) input.value='';
  State.errorMsg='';
  State.isTyping = true;
  render();
  persistChat(chat);

  try{
    const data = await api('/api/ai', {method:'POST', body:JSON.stringify({
      theme: chat.theme, mode: chat.mode, messages: chat.messages.map(m=>({role:m.role, text:m.text}))
    })});
    const aiMsg = { id:uid(), role:'assistant', text:data.reply, ts:Date.now() };
    chat.messages.push(aiMsg);
    chat.updatedAt = Date.now();
    State.isTyping = false;
    render();
    persistChat(chat);
  }catch(err){
    State.isTyping = false;
    State.errorMsg = err.message || 'Waduh, SoulyKGN lagi susah dihubungi. Coba kirim lagi ya.';
    render();
  }
}

function handleComposerKeydown(ev){
  if(ev.key==='Enter' && !ev.shiftKey){
    ev.preventDefault();
    const input = document.getElementById('soulyInput');
    sendText(input ? input.value : '');
  }
}
function handleComposerSubmit(ev){
  ev.preventDefault();
  const input = document.getElementById('soulyInput');
  sendText(input ? input.value : '');
}

function toggleSidebar(v){ State.sidebarOpen = v; render(); }
function toggleDevInfo(v){ State.devInfoOpen = v; render(); }

/* ---------------- Render: pieces ---------------- */
function ring(color, size, extraClass){
  return `<span class="souly-ring ${extraClass||''}" style="width:${size}px;height:${size}px;--ring-color:${color};"></span>`;
}

function renderAuth(){
  const isLogin = State.authTab==='login';
  return `
  <div class="souly-auth">
    <div class="souly-auth-card">
      <div class="souly-auth-head">
        <div class="souly-brand-logo-wrap">
          ${ring('#2F8CFF',54,'')}
          <img src="${LOGO_SRC}" alt="SoulyKGN" class="souly-brand-logo">
        </div>
        <h1><span class="brand-souly">souly</span><span class="brand-kgn">KGN</span></h1>
        <p>Teman ngobrol AI, kapan aja butuh</p>
      </div>
      <div class="souly-auth-tabs">
        <button class="souly-auth-tab ${isLogin?'active':''}" onclick="setAuthTab('login')">Masuk</button>
        <button class="souly-auth-tab ${!isLogin?'active':''}" onclick="setAuthTab('register')">Daftar</button>
      </div>
      ${State.authError ? `<div class="souly-auth-error">${escapeHtml(State.authError)}</div>` : ''}
      <div class="souly-field">
        <label>Username</label>
        <input id="authUsername" type="text" placeholder="contoh: rizal_16" autocomplete="username">
      </div>
      <div class="souly-field">
        <label>Password</label>
        <input id="authPassword" type="password" placeholder="minimal 4 karakter" autocomplete="${isLogin?'current-password':'new-password'}">
      </div>
      ${!isLogin ? `
      <div class="souly-field">
        <label>Konfirmasi Password</label>
        <input id="authConfirm" type="password" placeholder="ulangi password" autocomplete="new-password">
      </div>` : ''}
      <button class="souly-auth-submit" ${State.authLoading?'disabled':''} onclick="${isLogin?'doLogin()':'doRegister()'}">
        ${State.authLoading ? '<span class="souly-spin">⏳</span>' : ''} ${isLogin?'Masuk':'Buat Akun'}
      </button>
      <p class="souly-auth-hint">${isLogin ? 'Belum punya akun? Klik tab Daftar di atas.' : 'Chat kamu tersimpan otomatis ke akun ini, bisa dibuka lagi kapan aja.'}</p>
    </div>
  </div>`;
}

function renderSidebar(){
  const chatsHtml = State.chats.length ? State.chats.map(c=>{
    const t = THEMES[c.theme] || THEMES.semua;
    const active = c.id===State.currentId;
    return `
    <button class="souly-history-item ${active?'active':''}" style="--accent:${t.color};" onclick="selectChat('${c.id}')">
      <span class="souly-history-icon">${t.icon}</span>
      <span class="souly-history-title">${escapeHtml(c.title || t.label)}</span>
      <span class="souly-history-del" onclick="deleteChat('${c.id}', event)">🗑</span>
    </button>`;
  }).join('') : `<p class="souly-history-empty">Belum ada obrolan. Pilih tema di atas buat mulai.</p>`;

  const themeCardsHtml = THEME_ORDER.map((key,i)=>{
    const t = THEMES[key];
    const wide = i===THEME_ORDER.length-1;
    return `
    <button class="souly-theme-card ${wide?'wide':''}" style="--accent:${t.color};" onclick="startNewChat('${key}')">
      <span class="ic">${t.icon}</span><span>${t.label}</span>
    </button>`;
  }).join('');

  return `
  <aside class="souly-sidebar ${State.sidebarOpen?'open':''}">
    <div class="souly-sidebar-head">
      <div class="souly-brand">
        <div class="souly-brand-logo-wrap">
          ${ring('#2F8CFF',54,'')}
          <img src="${LOGO_SRC}" alt="SoulyKGN" class="souly-brand-logo">
        </div>
        <div class="souly-brand-text">
          <span class="brand-word"><span class="brand-souly">souly</span><span class="brand-kgn">KGN</span></span>
          <small>teman ngobrol, kapan aja</small>
        </div>
      </div>
      <button class="souly-iconbtn souly-only-mobile" onclick="toggleSidebar(false)" aria-label="Tutup menu">✕</button>
    </div>

    <div class="souly-mode-toggle" role="tablist" aria-label="Mode respons">
      ${Object.values(MODES).map(m=>`
        <button class="souly-mode-btn ${State.mode===m.key?'active':''}" onclick="setMode('${m.key}')">
          <span style="font-size:14px;">${m.icon}</span>
          <span>${m.label}<small>${m.desc}</small></span>
        </button>`).join('')}
    </div>

    <div class="souly-section-label">Pilih tema, mulai obrolan baru</div>
    <div class="souly-theme-grid">${themeCardsHtml}</div>

    <div class="souly-section-label souly-history-label"><span>Riwayat Obrolan</span></div>
    <div class="souly-history">${chatsHtml}</div>

    <div class="souly-sidebar-footer">
      <div class="souly-footer-user">Masuk sebagai <b>@${escapeHtml(State.username||'')}</b></div>
      <button class="souly-footer-btn" onclick="toggleDevInfo(true)">ℹ️ Tentang Developer</button>
      <button class="souly-footer-btn" onclick="doLogout()">🚪 Keluar Akun</button>
    </div>
  </aside>`;
}

function renderMessageBubble(m, theme){
  const isUser = m.role==='user';
  return `
  <div class="souly-msg ${isUser?'user':'ai'}">
    ${!isUser ? `<div class="souly-avatar" style="border-color:${theme.color};box-shadow:0 0 10px -2px ${theme.color};"><img src="${LOGO_SRC}" alt=""></div>` : ''}
    <div class="souly-bubble ${isUser?'user':'ai'}" style="--accent:${theme.color};"><p>${escapeHtml(m.text)}</p></div>
  </div>`;
}

function renderTyping(theme){
  return `
  <div class="souly-msg ai">
    <div class="souly-avatar" style="border-color:${theme.color};box-shadow:0 0 10px -2px ${theme.color};"><img src="${LOGO_SRC}" alt=""></div>
    <div class="souly-bubble ai souly-typing" style="--accent:${theme.color};">
      <span class="souly-dot" style="background:${theme.color};"></span>
      <span class="souly-dot" style="background:${theme.color};"></span>
      <span class="souly-dot" style="background:${theme.color};"></span>
    </div>
  </div>`;
}

function renderThread(){
  const chat = getCurrentChat();
  if(!chat){
    return `
    <div class="souly-empty-state">
      <div class="souly-empty-logo-wrap">
        ${ring('#2F8CFF',84,'')}
        <img src="${LOGO_SRC}" alt="" class="souly-empty-logo">
      </div>
      <h2>Halo, aku <span class="brand-souly">souly</span><span class="brand-kgn">KGN</span></h2>
      <p>Pilih salah satu tema di sidebar, atau langsung ketik apa aja di bawah ini.</p>
      <div class="souly-starter-row">
        ${THEME_ORDER.map(key=>{ const t=THEMES[key]; return `<button class="souly-starter-chip" style="--accent:${t.color};" onclick="startNewChat('${key}')">${t.icon} ${t.label}</button>`; }).join('')}
      </div>
    </div>`;
  }

  const theme = THEMES[chat.theme] || THEMES.semua;
  let html = '';
  if(chat.messages.length===0){
    html += `
    <div class="souly-empty-state">
      <div class="souly-empty-logo-wrap">
        ${ring(theme.color,84,'')}
        <div class="souly-empty-icon">${theme.icon}</div>
      </div>
      <h2 style="color:${theme.color};">${theme.label}</h2>
      <p>${theme.tagline}</p>
      <div class="souly-starter-row">
        ${theme.starters.map(s=>`<button class="souly-starter-chip" style="--accent:${theme.color};" onclick="sendText(${attrJson(s)})">${escapeHtml(s)}</button>`).join('')}
      </div>
    </div>`;
  } else {
    html += chat.messages.map(m=>renderMessageBubble(m, theme)).join('');
  }
  if(State.isTyping) html += renderTyping(theme);
  if(State.errorMsg) html += `<div class="souly-error">${escapeHtml(State.errorMsg)}</div>`;
  return html;
}

function renderMain(){
  const chat = getCurrentChat();
  const theme = chat ? (THEMES[chat.theme]||THEMES.semua) : null;
  return `
  <main class="souly-main">
    <header class="souly-topbar">
      <button class="souly-iconbtn souly-only-mobile" onclick="toggleSidebar(true)" aria-label="Buka menu">☰</button>
      ${chat ? `
      <div class="souly-topbar-theme" style="--accent:${theme.color};">
        <span class="ic">${theme.icon}</span>
        <div><b style="color:${theme.color};">${theme.label}</b><small>${theme.tagline}</small></div>
      </div>` : `
      <div class="souly-topbar-theme" style="--accent:#2F8CFF;">
        <span class="ic">💬</span>
        <div><b style="color:#2F8CFF;">Mulai Obrolan</b><small>Pilih tema di sidebar buat mulai</small></div>
      </div>`}
      <div class="souly-topbar-mode">${MODES[State.mode].icon} ${MODES[State.mode].label}</div>
    </header>

    <div class="souly-thread" id="soulyThread">${renderThread()}</div>

    <form class="souly-composer" onsubmit="handleComposerSubmit(event)">
      <textarea id="soulyInput" class="souly-input" rows="1"
        placeholder="${chat ? 'Ketik sesuatu buat '+theme.label.toLowerCase()+'...' : 'Ketik apa aja, obrolan baru bakal otomatis dibuat...'}"
        onkeydown="handleComposerKeydown(event)"></textarea>
      <button type="submit" class="souly-sendbtn" style="--accent:${theme?theme.color:'#2F8CFF'};" ${State.isTyping?'disabled':''} aria-label="Kirim">
        ${State.isTyping ? '<span class="souly-spin">⏳</span>' : '➤'}
      </button>
    </form>
  </main>`;
}

function openDevWhatsapp(){
  const msg = encodeURIComponent('Halo, aku mau tanya soal SoulyKGN');
  window.open(`https://wa.me/${DEV_INFO.whatsapp}?text=${msg}`, '_blank');
}

function renderDevInfoModal(){
  if(!State.devInfoOpen) return '';
  return `
  <div class="souly-modal-overlay" onclick="if(event.target===this) toggleDevInfo(false)">
    <div class="souly-modal">
      <button class="souly-modal-close" onclick="toggleDevInfo(false)">✕</button>
      <div class="souly-dev-avatar">
        ${ring('#7FC4FF',86,'')}
        R
      </div>
      <h3>${escapeHtml(DEV_INFO.name)}</h3>
      <div class="role">Developer & Founder SoulyKGN</div>
      <div class="souly-dev-row"><span>Nama</span><span>${escapeHtml(DEV_INFO.name)}</span></div>
      <div class="souly-dev-row"><span>Umur</span><span>${DEV_INFO.age} tahun</span></div>
      <p class="souly-dev-note">Dibuat dengan 💙 buat nemenin kamu ngobrol, kapan pun butuh — kangen, excited, curhat, atau butuh semangat.</p>
      <button class="souly-dev-whatsapp" onclick="openDevWhatsapp()">
        <span class="ic">💬</span> Hubungi Developer via WhatsApp
      </button>
    </div>
  </div>`;
}

function renderApp(){
  return `
  <div class="souly-app">
    <div class="souly-backdrop ${State.sidebarOpen?'show':''}" onclick="toggleSidebar(false)"></div>
    ${renderSidebar()}
    ${renderMain()}
    ${renderDevInfoModal()}
  </div>`;
}

/* ---------------- Render root ---------------- */
function render(){
  const root = document.getElementById('root');
  root.innerHTML = State.view==='login' ? renderAuth() : (State.view==='intro' ? renderIntro() : renderApp());
  const threadEl = document.getElementById('soulyThread');
  if(threadEl) threadEl.scrollTop = threadEl.scrollHeight;
}

/* ---------------- Fix tinggi layar mobile (biar composer/input tidak
   ketutup toolbar browser saat 100vh meleset — sama seperti pola yang
   dipakai Claude.ai dkk) ---------------- */
function setAppViewportHeight(){
  const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  document.documentElement.style.setProperty('--app-vh', (h * 0.01) + 'px');
}
setAppViewportHeight();
window.addEventListener('resize', setAppViewportHeight);
window.addEventListener('orientationchange', setAppViewportHeight);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', setAppViewportHeight);
}

init();
</script>
